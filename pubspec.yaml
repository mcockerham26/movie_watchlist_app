name: movie_watchlist_app
description: "A Flutter movie watchlist app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints
  # to encourage good coding practices.
  flutter_lints: ^5.0.0

# For information on the generic Dart part of this file, see:
# https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # Movie poster images used by the app.
  assets:
    - assets/images/

  # An image asset can refer to one or more resolution-specific "variants".
  # For details, see Flutter's documentation on resolution-aware images.

  # To add custom fonts to your application, add a fonts section here.
  # Each entry should have a "family" key with the font family name
  # and a "fonts" key with a list of font files.
  #
  # Example:
  #
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic